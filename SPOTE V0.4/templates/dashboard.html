<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPOTE · Mis tareas</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="dashboard-body">
  <header class="topbar">
    <div class="topbar-brand">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z" fill="#2196f3"/>
      </svg>
      <span>SPOTE</span>
    </div>
    <div class="topbar-user">
      <span>Hola, {{USER_NAME}}</span>
      <a class="btn btn-outline btn-small" href="/logout">Cerrar sesión</a>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="dashboard-toolbar">
      <h1>Mis tareas y exámenes</h1>
      <span class="pending-badge" id="pendingBadge" style="display:none;"></span>
    </div>

    <!-- Progreso del alumno (tabla "progreso") -->
    <div class="progress-summary" id="progressSummary" style="display:none;">
      <div class="progress-summary-top">
        <span id="progressLabel">Progreso general</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%; background:#4caf50;"></div>
      </div>
    </div>

    <!-- Filtrar por tipo: TODAS, TAREAS, EXÁMENES, PROYECTOS -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="todas">TODAS</button>
      <button class="filter-tab" data-filter="tarea">TAREAS</button>
      <button class="filter-tab" data-filter="examen">EXÁMENES</button>
      <button class="filter-tab" data-filter="proyecto">PROYECTOS</button>
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
      No tienes tareas registradas todavía. Crea la primera con el botón "+".
    </div>

    <div id="taskList" class="task-list"></div>
  </main>

  <!-- Botón flotante para agregar tarea -->
  <button class="fab" id="openAddTask" title="Nueva tarea" aria-label="Nueva tarea">+</button>

  <!-- Menú inferior -->
  <nav class="bottom-nav">
    <button class="bottom-nav-item active" type="button">
      <span class="bottom-nav-icon">📋</span>
      <span>Tareas</span>
    </button>
  </nav>

  <!-- Modal Agregar/Editar tarea -->
  <div class="modal-backdrop" id="taskBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h2 id="taskModalTitle">Nueva tarea</h2>
        <button type="button" class="modal-close" id="closeTaskModal">&times;</button>
      </div>
      <form id="taskForm" class="form">
        <input type="hidden" id="task_id" />

        <div class="field">
          <label for="task_title">Título *</label>
          <input type="text" id="task_title" required />
          <span class="field-error" id="err_title"></span>
        </div>

        <div class="field">
          <label for="task_description">Descripción</label>
          <textarea id="task_description" rows="3"></textarea>
        </div>

        <div class="field">
          <label for="task_subject">Materia *</label>
          <input type="text" id="task_subject" required />
          <span class="field-error" id="err_subject"></span>
        </div>

        <div class="field">
          <label for="task_professor">Profesor *</label>
          <input type="text" id="task_professor" placeholder="Solo letras, ej. María Pérez" required />
          <span class="field-error" id="err_professor"></span>
        </div>

        <div class="field">
          <label for="task_category">Categoría *</label>
          <input type="text" id="task_category" placeholder="Ej. Parcial 1, Individual, Equipo..." required />
          <span class="field-error" id="err_category"></span>
        </div>

        <div class="field">
          <label for="task_type">Tipo</label>
          <select id="task_type">
            <option value="tarea">Tarea</option>
            <option value="examen">Examen</option>
            <option value="proyecto">Proyecto</option>
          </select>
        </div>

        <div class="field">
          <label for="task_status">Estado</label>
          <select id="task_status">
            <option value="sin iniciar">Sin iniciar</option>
            <option value="en proceso">En proceso</option>
            <option value="terminado">Terminado</option>
          </select>
        </div>

        <div class="field">
          <label for="task_deadline">Fecha de Entrega *</label>
          <input type="date" id="task_deadline" min="{{TODAY}}" required />
          <span class="caption">No se permiten fechas anteriores a hoy.</span>
          <span class="field-error" id="err_deadline"></span>
        </div>

        <div class="field">
          <label for="task_collaborator_input">Añadir colaborador</label>
          <div class="collaborator-search-wrap">
            <input
              type="text"
              id="task_collaborator_input"
              placeholder="Escribe el nombre de un alumno registrado..."
              autocomplete="off"
            />
            <div class="collaborator-results" id="collaboratorResults"></div>
          </div>
          <div class="collaborator-chips" id="collaboratorChips"></div>
        </div>

        <p class="field-error" id="err_nochange" style="display:none;">No se ha realizado ningún cambio.</p>
      </form>
      <div class="modal-actions">
        <button type="button" class="btn btn-link" id="cancelTaskModal">Cancelar</button>
        <span class="save-wrap" id="saveWrap">
          <button type="button" class="btn btn-primary" id="saveTaskBtn">Guardar</button>
          <span class="save-tooltip" id="saveTooltip" role="tooltip"></span>
        </span>
      </div>
    </div>
  </div>

  <!-- Modal de confirmación de eliminación -->
  <div class="modal-backdrop" id="deleteBackdrop">
    <div class="modal modal-small">
      <div class="modal-header">
        <h2>Eliminar tarea</h2>
      </div>
      <p>¿Estás seguro de eliminar?</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelDeleteBtn">CANCELAR</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">CONFIRMAR</button>
      </div>
    </div>
  </div>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
