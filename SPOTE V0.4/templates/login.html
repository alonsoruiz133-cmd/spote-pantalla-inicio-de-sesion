<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPOTE · Iniciar sesión</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="page">
    <div class="particles" id="particles"></div>

    <main class="auth-wrap">
      <section class="card">
        <header class="card-header">
          <div class="logo-badge">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z" fill="#2196f3"/>
            </svg>
          </div>
          <h1>SPOTE</h1>
          <p class="tagline">Sistema para Organización de Tareas y Exámenes</p>
          <p class="subtagline">Instituto Tecnológico de Saltillo</p>
        </header>

        <div class="card-body">
          {{FLASH}}

          <form method="POST" action="/login" class="form" autocomplete="on">
            <div class="field">
              <label for="email">Correo electrónico</label>
              <div class="input-wrap">
                <span class="icon">✉</span>
                <input type="email" id="email" name="email" placeholder="tucorreo@itsaltillo.edu.mx" required />
              </div>
            </div>

            <div class="field">
              <label for="password">Contraseña</label>
              <div class="input-wrap">
                <span class="icon">🔒</span>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6" />
                <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">👁</button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
            <button type="button" class="btn btn-link" id="openRegister">¿No tienes cuenta? Regístrate</button>
          </form>

          <div class="divider"><span>O continúa con</span></div>

          <div class="social-row">
            <form method="POST" action="/social-login/google">
              <button type="submit" class="btn btn-outline">Google</button>
            </form>
            <form method="POST" action="/social-login/github">
              <button type="submit" class="btn btn-outline">GitHub</button>
            </form>
          </div>

          <p class="fine-print">Al continuar, aceptas nuestros términos y condiciones.</p>
        </div>
      </section>

      <p class="hint">Cuenta demo: <strong>demo@spote.mx</strong> / <strong>demo123</strong></p>
    </main>
  </div>

  <!-- Modal de registro -->
  <div class="modal-backdrop" id="registerBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h2>Crear cuenta</h2>
        <button type="button" class="modal-close" id="closeRegister">&times;</button>
      </div>
      <form method="POST" action="/register" class="form">
        <div class="field">
          <label for="reg_name">Nombre completo</label>
          <input type="text" id="reg_name" name="name" required />
        </div>
        <div class="field">
          <label for="reg_career">Carrera</label>
          <input type="text" id="reg_career" name="career" placeholder="Ej. Ing. en Sistemas Computacionales" required />
        </div>
        <div class="field">
          <label for="reg_semester">Semestre</label>
          <select id="reg_semester" name="semester" required>
            <option value="" disabled selected>Selecciona tu semestre</option>
            <option value="1">1° Semestre</option>
            <option value="2">2° Semestre</option>
            <option value="3">3° Semestre</option>
            <option value="4">4° Semestre</option>
            <option value="5">5° Semestre</option>
            <option value="6">6° Semestre</option>
            <option value="7">7° Semestre</option>
            <option value="8">8° Semestre</option>
            <option value="9">9° Semestre</option>
            <option value="10">10° Semestre</option>
            <option value="11">11° Semestre</option>
            <option value="12">12° Semestre</option>
          </select>
        </div>
        <div class="field">
          <label for="reg_email">Correo electrónico</label>
          <input type="email" id="reg_email" name="email" required />
        </div>
        <div class="field">
          <label for="reg_password">Contraseña</label>
          <input type="password" id="reg_password" name="password" minlength="6" required />
        </div>
        <div class="field">
          <label for="reg_confirm">Confirmar contraseña</label>
          <input type="password" id="reg_confirm" name="confirm_password" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary">Crear cuenta</button>
      </form>
    </div>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
