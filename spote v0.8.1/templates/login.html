<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPOTE · Iniciar sesión</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="page">
    <div class="particles" id="particles"></div>

    <main class="auth-wrap">
      <section class="card">
        <header class="card-header">
          <div class="logo-badge">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z" fill="#2196f3"/>
            </svg>
          </div>
          <h1>SPOTE</h1>
          <p class="tagline">Sistema para Organización de Tareas y Exámenes</p>
          <p class="subtagline">Instituto Tecnológico de Saltillo</p>
        </header>

        <div class="card-body">
          {{FLASH}}

          <form method="POST" action="/login" class="form" autocomplete="on">
            <div class="field">
              <label for="email">Correo electrónico</label>
              <div class="input-wrap">
                <span class="icon">✉</span>
                <input type="email" id="email" name="email" placeholder="Ej. 21050123@saltillo.tecnm.mx" required />
              </div>
            </div>

            <div class="field">
              <label for="password">Contraseña</label>
              <div class="input-wrap">
                <span class="icon">🔒</span>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6" />
                <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">👁</button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
            <button type="button" class="btn btn-link" id="openRegister">¿No tienes cuenta? Regístrate</button>
          </form>

          <p class="fine-print">Al continuar, aceptas nuestros términos y condiciones.</p>
        </div>
      </section>

      <p class="hint">Cuenta demo: <strong>demo@spote.mx</strong> / <strong>demo123</strong></p>
    </main>
  </div>

  <div class="modal-backdrop" id="registerBackdrop">
    <div class="modal">
      <div class="modal-header">
        <h2>Crear cuenta</h2>
        <button type="button" class="modal-close" id="closeRegister">&times;</button>
      </div>
      <form method="POST" action="/register" class="form" id="registerForm" novalidate>
        <p class="caption">Todos los campos marcados con * son obligatorios.</p>
        <div class="field">
          <label for="reg_first">Nombre(s) *</label>
          <input type="text" id="reg_first" name="first_name" placeholder="Ej. María Fernanda" autocomplete="given-name" required />
        </div>
        <div class="field">
          <label for="reg_last1">Apellido paterno *</label>
          <input type="text" id="reg_last1" name="last_name_p" placeholder="Ej. Pérez" autocomplete="off" required />
        </div>
        <div class="field">
          <label for="reg_last2">Apellido materno *</label>
          <input type="text" id="reg_last2" name="last_name_m" placeholder="Ej. López" autocomplete="off" required />
        </div>
        <div class="field">
          <label for="reg_career">Carrera *</label>
          <select id="reg_career" name="career" required>
            <option value="" selected>Selecciona tu carrera</option>
            <option value="Ingeniería en Sistemas Computacionales">Ingeniería en Sistemas Computacionales</option>
            <option value="Ingeniería Mecatrónica">Ingeniería Mecatrónica</option>
            <option value="Ingeniería Mecánica">Ingeniería Mecánica</option>
            <option value="Ingeniería en Materiales">Ingeniería en Materiales</option>
            <option value="Ingeniería Eléctrica">Ingeniería Eléctrica</option>
            <option value="Ingeniería Electrónica">Ingeniería Electrónica</option>
            <option value="Ingeniería Industrial">Ingeniería Industrial</option>
            <option value="Ingeniería en Gestión Empresarial">Ingeniería en Gestión Empresarial</option>
            <option value="Distancia Industrial (77)">Distancia Industrial (77)</option>
            <option value="Distancia Industrial (99)">Distancia Industrial (99)</option>
            <option value="Distancia Sistemas">Distancia Sistemas</option>
            <option value="Distancia Gestión">Distancia Gestión</option>
          </select>
        </div>
        <div class="field">
          <label for="reg_semester">Semestre *</label>
          <select id="reg_semester" name="semester" required>
            <option value="" selected>Selecciona tu semestre</option>
            <option value="1">1° Semestre</option>
            <option value="2">2° Semestre</option>
            <option value="3">3° Semestre</option>
            <option value="4">4° Semestre</option>
            <option value="5">5° Semestre</option>
            <option value="6">6° Semestre</option>
            <option value="7">7° Semestre</option>
            <option value="8">8° Semestre</option>
            <option value="9">9° Semestre</option>
            <option value="10">10° Semestre</option>
            <option value="11">11° Semestre</option>
            <option value="12">12° Semestre</option>
            <option value="13">13° Semestre</option>
            <option value="14">14° Semestre</option>
          </select>
        </div>
        <div class="field">
          <label for="reg_control">Número de control *</label>
          <input type="text" id="reg_control" name="control_number" placeholder="Ej. C21050123 o 21050123" maxlength="9" autocomplete="off" required />
        </div>
        <div class="field">
          <label for="reg_phone">Número de teléfono *</label>
          <input type="tel" id="reg_phone" name="phone" placeholder="10 dígitos, ej. 8441234567" inputmode="numeric" maxlength="10" autocomplete="tel" required />
        </div>
        <div class="field">
          <label for="reg_email">Correo electrónico *</label>
          <input type="email" id="reg_email" name="email" placeholder="tucorreo@itsaltillo.edu.mx" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="reg_email_confirm">Confirmar correo electrónico *</label>
          <input type="email" id="reg_email_confirm" name="confirm_email" placeholder="Repite tu correo electrónico" autocomplete="off" required />
        </div>
        <div class="field">
          <label for="reg_password">Contraseña *</label>
          <input type="password" id="reg_password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="reg_confirm">Confirmar contraseña *</label>
          <input type="password" id="reg_confirm" name="confirm_password" placeholder="Repite tu contraseña" minlength="6" autocomplete="new-password" required />
        </div>
        <span class="save-wrap full is-blocked" id="regWrap">
          <button type="submit" class="btn btn-primary" id="regSubmit" disabled>Crear cuenta</button>
          <span class="save-tooltip" id="regTooltip" role="tooltip"></span>
        </span>
      </form>
    </div>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
