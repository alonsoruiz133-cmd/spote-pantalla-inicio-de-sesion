<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPOTE · Panel</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="page dashboard-page">
    <main class="dashboard-wrap">
      <section class="card dashboard-card">
        <header class="card-header small">
          <h1>Bienvenido, {{ name }}</h1>
          <p class="tagline">{{ career }} · {{ semester }}</p>
        </header>
        <div class="card-body">
          <p>Iniciaste sesión correctamente como <strong>{{ email }}</strong>.</p>
          <p>Aquí se desplegaría el dashboard al iniciar sesión.</p>
          <a class="btn btn-outline" href="/logout">Cerrar sesión</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
